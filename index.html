
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080810">
  <title>SHADOW WATCH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080810;
      color: white;
      text-align: center;
    }

    header {
      padding: 28px 15px;
      background: #100c1c;
      border-bottom: 2px solid #7040b8;
    }

    header h1 {
      color: #b58cff;
      letter-spacing: 4px;
      font-size: 30px;
    }

    header p {
      color: #ddd;
    }

    .container {
      width: 90%;
      max-width: 440px;
      margin: 35px auto;
      padding: 25px;
      background: #151321;
      border: 1px solid #6841a5;
      border-radius: 18px;
      box-shadow: 0 0 25px #32175a55;
    }

    h2 {
      color: #b58cff;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      background: #090812;
      color: white;
      border: 1px solid #554078;
    }

    button {
      background: #7040b8;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2678c9;
    }

    .green {
      background: #176b45;
    }

    .blue {
      background: #176b9c;
    }

    #message {
      color: #8fe5a5;
      overflow-wrap: anywhere;
    }

    #compte {
      display: none;
    }

    .anime {
      margin-top: 25px;
      padding: 18px;
      background: #100c1c;
      border: 1px solid #354c91;
      border-radius: 12px;
    }

    footer {
      padding: 25px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>SHADOW WATCH</h1>
    <p>L'ombre nous rassemble.</p>
  </header>

  <main class="container">

    <section id="auth">
      <h2>Bienvenue dans l'ombre</h2>
      <p>Retrouve tes amis et rejoins la communauté anime.</p>

      <input
        id="pseudo"
        type="text"
        placeholder="Choisis ton pseudo"
        maxlength="30"
      >

      <input
        id="email"
        type="email"
        placeholder="Ton adresse email"
      >

      <input
        id="password"
        type="password"
        placeholder="Ton mot de passe"
      >

      <button onclick="inscription()">
        CRÉER MON COMPTE
      </button>

      <button class="green" onclick="connexion()">
        SE CONNECTER
      </button>

      <p id="message" aria-live="polite"></p>
    </section>

    <section id="compte">
      <h2>Bienvenue dans l'ombre !</h2>
      <p id="bienvenue"></p>

      <div class="anime">
        <h3>SHADOW WATCH</h3>
        <p>Ta communauté anime commence ici.</p>
        <p>Les salons et le chat multijoueur arrivent dans cette interface.</p>
      </div>

      <button class="blue" onclick="deconnexion()">
        SE DÉCONNECTER
      </button>
    </section>

  </main>

  <footer>
    SHADOW WATCH © 2026
    <p>L'ombre nous rassemble.</p>
  </footer>

  <script>
    const SUPABASE_URL =
      "https://ycjbzxzwdvmujdawaewh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SRzPt8W5qQkrwX5OV0HT4Q_TloQzh0c";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function afficher(texte) {
      document.getElementById("message").textContent = texte;
    }

    async function inscription() {
      const pseudo = document.getElementById("pseudo").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!pseudo || !email || !password) {
        afficher("Remplis tous les champs.");
        return;
      }

      if (password.length < 6) {
        afficher("Le mot de passe doit contenir au moins 6 caractères.");
        return;
      }

      afficher("Création du compte en cours...");

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: {
            pseudo: pseudo
          }
        }
      });

      if (error) {
        afficher(error.message);
        return;
      }

      if (data.session) {
        afficher("Compte créé avec succès !");
        afficherCompte(data.user);
      } else {
        afficher(
          "Compte créé ! Vérifie ton email pour confirmer ton inscription."
        );
      }
    }

    async function connexion() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        afficher("Entre ton email et ton mot de passe.");
        return;
      }

      afficher("Connexion en cours...");

      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        afficher(error.message);
        return;
      }

      afficherCompte(data.user);
    }

    function afficherCompte(user) {
      const pseudo = user.user_metadata?.pseudo || "Membre";

      document.getElementById("auth").style.display = "none";
      document.getElementById("compte").style.display = "block";

      document.getElementById("bienvenue").textContent =
        "Connecté en tant que " + pseudo;
    }

    async function deconnexion() {
      const { error } = await db.auth.signOut();

      if (error) {
        afficher(error.message);
        return;
      }

      document.getElementById("compte").style.display = "none";
      document.getElementById("auth").style.display = "block";

      afficher("Tu es déconnecté.");
    }

    async function verifierSession() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        afficher(error.message);
        return;
      }

      if (data.session) {
        afficherCompte(data.session.user);
      }
    }

    verifierSession();
  </script>

</body>
  </html>
