
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOW WATCH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    linear-gradient(90deg,
      rgba(8,5,20,.12) 0%,
      rgba(8,5,20,.15) 48%,
      rgba(12,7,30,.75) 100%),
    url("from-PixAI-2078003211904014643-逆転世界.png")
    center center / cover no-repeat fixed;
}

header {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  background: rgba(10,7,25,.35);
  backdrop-filter: blur(8px);
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #a98aff;
}

nav {
  display: flex;
  gap: 28px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

main {
  min-height: calc(100vh - 75px);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 35px 8%;
}

.login-panel {
  width: 390px;
  max-width: 100%;
  padding: 38px;
  border-radius: 22px;
  background: rgba(20,15,42,.78);
  border: 1px solid rgba(190,160,255,.4);
  backdrop-filter: blur(18px);
  box-shadow: 0 15px 60px rgba(0,0,0,.35);
}

.login-panel h1 {
  font-size: 29px;
  margin-bottom: 10px;
}

.subtitle {
  color: #d0c4ec;
  margin-bottom: 28px;
  line-height: 1.5;
}

input {
  width: 100%;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid #7962a8;
  background: rgba(255,255,255,.09);
  color: white;
  font-size: 15px;
}

input::placeholder {
  color: #c7bdd9;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(110deg,#7950df,#3979ed);
  color: white;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  margin-top: 8px;
}

button:hover {
  filter: brightness(1.15);
}

.switch {
  text-align: center;
  margin-top: 23px;
  color: #ddd2f5;
  font-size: 14px;
}

.switch a {
  color: #b99aff;
  cursor: pointer;
  font-weight: bold;
}

#message {
  margin-top: 15px;
  font-size: 13px;
  line-height: 1.5;
  color: #e2d7ff;
}

.hidden {
  display: none;
}

@media(max-width:700px) {
  body {
    background-attachment: scroll;
    background-position: center;
  }

  header {
    height: 65px;
    padding: 0 18px;
  }

  .logo {
    font-size: 19px;
  }

  nav {
    gap: 12px;
  }

  nav a {
    font-size: 11px;
  }

  main {
    min-height: calc(100vh - 65px);
    justify-content: center;
    padding: 25px 16px;
  }

  .login-panel {
    padding: 27px 22px;
    background: rgba(20,15,42,.88);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SHADOW <span>WATCH</span></div>
  <nav>
    <a href="#">Animés</a>
    <a href="#">Salons</a>
    <a href="#">Communauté</a>
  </nav>
</header>

<main>
  <section class="login-panel">

    <div id="login">
      <h1>Bienvenue dans l'ombre</h1>
      <p class="subtitle">Retrouve ta communauté anime.</p>

      <input id="loginEmail" type="email"
        placeholder="Adresse e-mail">

      <input id="loginPassword" type="password"
        placeholder="Mot de passe">

      <button onclick="signIn()">Se connecter</button>

      <p class="switch">
        Pas encore de compte ?
        <a onclick="showSignup()">S'inscrire</a>
      </p>
    </div>

    <div id="signup" class="hidden">
      <h1>Rejoins-nous</h1>
      <p class="subtitle">Crée ton identité dans l'univers Shadow.</p>

      <input id="pseudo" type="text" placeholder="Ton pseudo">
      <input id="signupEmail" type="email"
        placeholder="Adresse e-mail">
      <input id="signupPassword" type="password"
        placeholder="Mot de passe (6 caractères minimum)">

      <button onclick="signUp()">Créer mon compte</button>

      <p class="switch">
        Déjà membre ?
        <a onclick="showLogin()">Se connecter</a>
      </p>
    </div>

    <p id="message"></p>
  </section>
</main>

<script>
const SUPABASE_URL =
  "https://ycjbzxzwdvmujdawaewh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_SRzPt8W5qQkrwX5OV0HT4Q_TloQzh0c";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function showSignup() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("signup").classList.remove("hidden");
  document.getElementById("message").textContent = "";
}

function showLogin() {
  document.getElementById("signup").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("message").textContent = "";
}

async function signUp() {
  const pseudo = document.getElementById("pseudo").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  const message = document.getElementById("message");

  if (!pseudo || !email || password.length < 6) {
    message.textContent = "Remplis tous les champs correctement.";
    return;
  }

  message.textContent = "Création du compte...";

  const { error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: { pseudo },
      emailRedirectTo: "https://stevetaminy1-ai.github.io/shadow-watch/"
    }
  });

  message.textContent = error
    ? error.message
    : "Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.";
}

async function signIn() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("message");

  if (!email || !password) {
    message.textContent = "Entre ton e-mail et ton mot de passe.";
    return;
  }

  message.textContent = "Connexion...";

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  message.textContent = error
    ? error.message
    : "Connexion réussie ! Bienvenue dans SHADOW WATCH.";
}
</script>

</body>
  </html>
